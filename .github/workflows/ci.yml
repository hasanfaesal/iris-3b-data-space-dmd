name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Checkout pinned iris-3b backbone
        run: |
          git clone https://github.com/speridlabs/iris-3b.git vendor/iris-3b
          git -C vendor/iris-3b checkout 13fcf6a4f7fcb36561eac3daa5ad30d0b0a1822e

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install transformers accelerate omegaconf safetensors huggingface_hub pillow numpy tqdm pytest ruff

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/iris-3b/src
        run: pytest -q tests
